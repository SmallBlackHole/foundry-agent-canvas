name: Release nightly build

# Bundles the extension with esbuild and publishes it as a zip asset on a
# rolling "nightly" prerelease when manually triggered, so users can grab a
# ready-to-run build without installing dependencies themselves.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build and package extension
        env:
          FOUNDRY_CANVAS_APPINSIGHTS_CONNECTION_STRING: ${{ secrets.FOUNDRY_CANVAS_APPINSIGHTS_CONNECTION_STRING }}
        run: |
          if [ -z "$FOUNDRY_CANVAS_APPINSIGHTS_CONNECTION_STRING" ]; then
            echo "::error::FOUNDRY_CANVAS_APPINSIGHTS_CONNECTION_STRING is not configured"
            exit 1
          fi
          npm run package

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/microsoft-foundry.zip \
            --title "Nightly build ($SHORT_SHA)" \
            --notes "Automated build from \`main\` @ ${{ github.sha }}. Download \`microsoft-foundry.zip\` and unzip it into \`.github/extensions/microsoft-foundry/\` in your project root." \
            --prerelease \
            --target "${{ github.sha }}"
